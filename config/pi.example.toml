[server]
host = "127.0.0.1"
port = 8090
allowed_cidrs = ["127.0.0.0/8"]
api_key_env = "PIPEDAL_AI_API_KEY"

[storage]
database = "./data/pipedal-ai.db"
artifact_root = "./data/artifacts"
upload_root = "/var/pipedal/audio_uploads"

[rtx]
base_url = "https://127.0.0.1:8091"
timeout_seconds = 300
bearer_token_env = "PIPEDAL_AI_RTX_TOKEN"
ca_file = ""
client_cert_file = ""
client_key_file = ""
enabled = false

[pipedal]
http_base_url = "http://127.0.0.1:80"
websocket_url = "ws://127.0.0.1:80/pipedal"
upload_path = "/var/uploadPreset"
# Local import cap for portable presets containing NAM/IR media (64 MiB).
max_upload_bytes = 67108864
allow_import = false
allow_activation = false

[policy]
max_chain_length = 10
max_prompt_chars = 2000
max_artifact_uncompressed_bytes = 67108864
default_input_volume_db = -6.0
default_output_volume_db = -6.0
max_load_per_cpu = 0.90
min_free_mb = 256

[bench]
enabled = false
di_root = "./data/di"
output_root = "./data/bench"
max_renders = 24
max_audio_cpu_percent = 75
tail_seconds = 2
track_directory = "shared/audio/Tracks"
record_directory = "shared/audio/Audio Recordings"
# nam_input_calibration_dbu = -6.0 # Only a measured technical value, never a tone knob.
