[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pipedal-ai"
version = "0.8.3"
description = "Authoritative PiPedal preset generation orchestrated by Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "soundfile>=0.13,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pipedal-ai = "pipedal_ai.cli:main"
pipedal-ai-pi = "pipedal_ai.pi.app:main"
pipedal-ai-rtx = "pipedal_ai.rtx.app:main"
pipedal-ai-fingerprint = "pipedal_ai.rtx.fingerprint_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipedal_ai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
